plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fkp2.keyboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fkp2.keyboard'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
